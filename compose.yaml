# Redis-protocol servers the integration and end-to-end tests run against.
# The library supports both, so both stay available: Valkey is the default,
# Redis is the second target.
#
# `docker compose up -d` starts them on the host ports below. The Dev
# Container drops those ports in `.devcontainer/compose.yaml` and reaches the
# services by name instead.
#
# Pinned so the volumes survive a moved checkout. Renaming orphans them.
name: next-cache-handlers

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
