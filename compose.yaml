# Redis-protocol servers the integration and end-to-end tests run against.
# The library supports both, so both stay available: Valkey is the default,
# Redis is the second target.
#
# `docker compose up -d` starts them on the host ports below. The Dev
# Container drops those ports in `.devcontainer/compose.yaml` and reaches the
# services by name instead.
#
# The project name is pinned rather than derived from the directory of the
# first compose file, so a moved checkout or a new compose file layout keeps
# the same containers and named volumes, including the Dev Container's.
# Renaming it orphans every one of them. `COMPOSE_PROJECT_NAME` still takes
# precedence, for a second checkout that needs a stack of its own.
name: next-cache-handlers

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
